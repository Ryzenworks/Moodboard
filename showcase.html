<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showcase Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.showcase-text {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.text-icon-btns { display: flex; gap: 4px; margin-top: 10px; }
.text-icon-btn {
  flex: 1;
  padding: 9px 4px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.04);
  color: rgba(255,255,255,0.5);
  font-family: inherit;
  font-size: 15px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 200ms ease;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.text-icon-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
.text-icon-btn .tip {
  position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  background: #222; color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 5px;
  white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 150ms;
}
.text-icon-btn:hover .tip { opacity: 1; }

/* ── GLOW SLIDER ────────────────────── */
.glow-slider-wrap {
  margin-top: 8px;
}
.glow-slider-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.glow-slider-row input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  border-radius: 2px;
  background: rgba(255,255,255,0.1);
  outline: none;
  cursor: pointer;
}
.glow-slider-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  border: none;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,0.4);
}
.glow-pct {
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  min-width: 32px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0a;
  --panel: #111;
  --border: rgba(255,255,255,0.06);
  --text: #fff;
  --text-dim: rgba(255,255,255,0.5);
  --text-label: rgba(255,255,255,0.35);
  --accent: #4285f4;
  --radius: 12px;
  --transition: 200ms ease;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── LAYOUT ─────────────────────────── */
.app-layout {
  display: flex;
  flex: 1;
  min-height: 0;
}

.left-sidebar {
  width: 200px;
  min-width: 200px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 0;
}

.center-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: repeating-conic-gradient(#1a1a1a 0% 25%, #151515 0% 50%) 0 0 / 20px 20px;
  position: relative;
  overflow: hidden;
  padding: 32px;
}

.right-sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--panel);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  padding: 20px;
}

.bottom-strip {
  height: 80px;
  min-height: 80px;
  background: var(--panel);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 8px;
  overflow-x: auto;
  overflow-y: hidden;
}

.bottom-strip::-webkit-scrollbar { height: 4px; }
.bottom-strip::-webkit-scrollbar-track { background: transparent; }
.bottom-strip::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

/* ── LEFT SIDEBAR ───────────────────── */
.sidebar-header {
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border);
  position: relative;
}

.back-link {
  font-size: 11px;
  color: var(--text-dim);
  text-decoration: none;
  transition: color var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 10px;
}
.back-link:hover { color: var(--text); }

.sidebar-title {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.sidebar-title svg { opacity: 0.7; }

.section-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-label);
  letter-spacing: 0.08em;
  padding: 16px 16px 8px;
}

.mode-list { padding: 0 10px 8px; display: flex; flex-direction: column; gap: 2px; }

.mode-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  border-radius: 8px;
  cursor: pointer;
  transition: all var(--transition);
  width: 100%;
  text-align: left;
}
.mode-btn:hover { background: rgba(255,255,255,0.04); color: var(--text); }
.mode-btn.active { background: #fff; color: #111; }
.mode-btn.active svg { stroke: #111; }
.mode-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ── RIGHT SIDEBAR ──────────────────── */
.settings-group {
  margin-bottom: 20px;
}

.settings-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-label);
  letter-spacing: 0.08em;
  margin-bottom: 10px;
  display: block;
}

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0;
}

.toggle-row-label {
  font-size: 13px;
  color: rgba(255,255,255,0.7);
  display: flex;
  align-items: center;
  gap: 8px;
}

.toggle-switch {
  width: 40px;
  height: 22px;
  background: rgba(255,255,255,0.1);
  border-radius: 11px;
  position: relative;
  cursor: pointer;
  transition: background var(--transition);
  border: none;
  outline: none;
}
.toggle-switch.on { background: var(--accent); }
.toggle-switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 16px;
  height: 16px;
  background: #fff;
  border-radius: 50%;
  transition: transform var(--transition);
}
.toggle-switch.on::after { transform: translateX(18px); }

.color-dots {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding: 4px 0;
}

.color-dot {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: all var(--transition);
  position: relative;
}
.color-dot:hover { transform: scale(1.15); }
.color-dot.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(66,133,244,0.3); }
.color-dot[data-color="#ffffff"] { background: #fff; }
.color-dot[data-color="#4285f4"] { background: #4285f4; }
.color-dot[data-color="#ea4335"] { background: #ea4335; }
.color-dot[data-color="#34a853"] { background: #34a853; }
.color-dot[data-color="#f48fb1"] { background: #f48fb1; }
.color-dot[data-color="#000000"] { background: #000; border: 2px solid rgba(255,255,255,0.15); }
.color-dot[data-color="#000000"].active { border-color: var(--accent); }

.padding-btns { display: flex; gap: 4px; }
.padding-btn {
  flex: 1;
  padding: 7px 4px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  border-radius: 6px;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}
.padding-btn:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }
.padding-btn.active { background: #fff; color: #111; border-color: #fff; }

.num-input-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 0;
}
.num-input-row label {
  font-size: 13px;
  color: rgba(255,255,255,0.7);
}
.num-input {
  width: 60px;
  padding: 6px 8px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.04);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  border-radius: 6px;
  text-align: center;
  outline: none;
  transition: border-color var(--transition);
}
.num-input:focus { border-color: var(--accent); }

.text-input-field {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.04);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  border-radius: 8px;
  outline: none;
  transition: border-color var(--transition);
  margin-bottom: 8px;
}
.text-input-field:focus { border-color: var(--accent); }
.text-input-field::placeholder { color: rgba(255,255,255,0.2); }

.save-btn {
  width: 100%;
  padding: 12px;
  border: none;
  background: #fff;
  color: #111;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
  margin-top: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.save-btn:hover { background: #e8e8e8; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(255,255,255,0.1); }
.save-btn:active { transform: translateY(0); }

.save-btn svg { width: 16px; height: 16px; }

/* ── CANVAS PREVIEW ─────────────────── */
.preview-container {
  width: 100%;
  max-width: 900px;
  background: #111;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  box-shadow: inset 0 0 60px rgba(0,0,0,0.4), 0 8px 40px rgba(0,0,0,0.4);
  transition: background var(--transition);
}

.preview-content {
  width: 100%;
  position: relative;
}

.preview-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: rgba(255,255,255,0.18);
  font-size: 14px;
  pointer-events: none;
  position: absolute;
  inset: 0;
  transition: opacity var(--transition);
}
.preview-empty svg { width: 48px; height: 48px; opacity: 0.3; }

.canvas-drop-highlight {
  border: 2px dashed var(--accent) !important;
  box-shadow: inset 0 0 40px rgba(66,133,244,0.08) !important;
}

/* ── CANVAS IMAGES ──────────────────── */
.canvas-img-wrap {
  position: relative;
  border-radius: 5%;
  overflow: hidden;
  transition: box-shadow var(--transition), opacity 150ms;
  aspect-ratio: 16 / 9;
}
.canvas-img-wrap.drag-over {
  outline: 3px solid var(--accent);
  outline-offset: -3px;
}
.canvas-img-wrap.dragging {
  opacity: 0.4;
}

.canvas-img-wrap .ambient-glow {
  position: absolute;
  inset: -15%;
  pointer-events: none;
  z-index: 0;
  filter: blur(28px);
  opacity: 0.18;
  transition: opacity var(--transition);
}

.canvas-img-wrap .ambient-glow img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 0;
}

.canvas-img-wrap > img {
  position: relative;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.canvas-img-wrap .remove-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  z-index: 10;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: rgba(0,0,0,0.7);
  border: 1px solid rgba(255,255,255,0.15);
  color: #fff;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0;
  transition: opacity var(--transition), background var(--transition);
  line-height: 1;
  backdrop-filter: blur(4px);
}
.canvas-img-wrap:hover .remove-btn { opacity: 1; }
.canvas-img-wrap .remove-btn:hover { background: #ea4335; }

/* ── GRID PLACEHOLDER ───────────────── */
.grid-placeholder {
  border: 2px dashed rgba(255,255,255,0.1);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.1);
  font-size: 24px;
}

/* ── SOLO TEXT TILE ──────────────────── */
.solo-tile {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 12px 0 0;
  width: 100%;
}
.solo-tile-thumb {
  width: 60px;
  height: 60px;
  border-radius: 8px;
  object-fit: cover;
  flex-shrink: 0;
}
.solo-tile-info { display: flex; flex-direction: column; gap: 4px; }
.solo-tile-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
}
.solo-tile-channel {
  display: inline-block;
  font-size: 11px;
  color: rgba(255,255,255,0.6);
  background: rgba(255,255,255,0.08);
  padding: 3px 10px;
  border-radius: 20px;
  width: fit-content;
}

/* ── THUMBNAIL STRIP ────────────────── */
.thumb-item {
  width: 60px;
  height: 60px;
  min-width: 60px;
  border-radius: 10px;
  overflow: hidden;
  cursor: grab;
  border: 2px solid transparent;
  transition: all var(--transition);
  position: relative;
}
.thumb-item:active { cursor: grabbing; }
.thumb-item:hover { border-color: rgba(255,255,255,0.2); transform: translateY(-2px); }
.thumb-item.selected { border-color: var(--accent); box-shadow: 0 0 12px rgba(66,133,244,0.3); }
.thumb-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
}

.strip-empty {
  color: rgba(255,255,255,0.15);
  font-size: 13px;
  white-space: nowrap;
  padding: 0 12px;
}

.strip-drop-hint {
  display: flex;
  align-items: center;
  gap: 10px;
  color: rgba(255,255,255,0.2);
  font-size: 12px;
  white-space: nowrap;
  border: 1.5px dashed rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 10px 18px;
  cursor: pointer;
  transition: all var(--transition);
  min-width: 200px;
  justify-content: center;
}
.strip-drop-hint:hover, .bottom-strip.drag-over .strip-drop-hint {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(66,133,244,0.05);
}
.bottom-strip.drag-over {
  background: rgba(66,133,244,0.03);
}

/* ── SCROLLBAR ──────────────────────── */
.left-sidebar::-webkit-scrollbar, .right-sidebar::-webkit-scrollbar { width: 4px; }
.left-sidebar::-webkit-scrollbar-track, .right-sidebar::-webkit-scrollbar-track { background: transparent; }
.left-sidebar::-webkit-scrollbar-thumb, .right-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }

/* hidden helper */
.hidden { display: none !important; }

/* ── LOADING STATE ──────────────────── */
.loading-strip {
  display: flex;
  align-items: center;
  gap: 8px;
  color: rgba(255,255,255,0.2);
  font-size: 12px;
}
.loading-strip .dot {
  width: 6px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 50%;
  animation: pulse 1.2s ease-in-out infinite;
}
.loading-strip .dot:nth-child(2) { animation-delay: 0.2s; }
.loading-strip .dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

/* ── TOAST ──────────────────────────── */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(20,20,20,0.9);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 20px;
  border-radius: 10px;
  font-size: 13px;
  pointer-events: none;
  opacity: 0;
  transition: all 300ms ease;
  backdrop-filter: blur(12px);
  z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="app-layout">
  <!-- ── LEFT SIDEBAR ──────────────── -->
  <aside class="left-sidebar">
    <div class="sidebar-header">
      <a href="index.html" class="back-link">← Back to Moodboard</a>
      <div class="sidebar-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Showcase Studio
      </div>
    </div>

    <div class="section-label">Modes</div>
    <div class="mode-list">
      <button class="mode-btn active" data-mode="grid">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>
        Grid
      </button>
      <button class="mode-btn" data-mode="compare">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="5" rx="1"/><rect x="3" y="10" width="18" height="5" rx="1"/><rect x="3" y="17" width="18" height="5" rx="1"/></svg>
        Compare
      </button>
      <button class="mode-btn" data-mode="solo">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        Solo
      </button>
    </div>

    <div class="section-label">Preview</div>
    <div class="mode-list">
      <button class="mode-btn active" data-preview="default">
        <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/></svg>
        Default
        <span style="font-size:10px;color:var(--text-label);margin-left:auto">3060×1878</span>
      </button>
      <button class="mode-btn" data-preview="twitter">
        <svg viewBox="0 0 24 24"><path d="M4 4l11.7 8L4 20V4z"/></svg>
        X / Twitter
        <span style="font-size:10px;color:var(--text-label);margin-left:auto">1200×675</span>
      </button>
    </div>
  </aside>

  <!-- ── CENTER ────────────────────── -->
  <main class="center-area" id="centerArea">
    <div class="preview-container" id="previewContainer">
      <div class="preview-content" id="previewContent">
        <div class="preview-empty" id="previewEmpty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <span>Drag images here from the strip below</span>
        </div>
      </div>
    </div>
  </main>

  <!-- ── RIGHT SIDEBAR ─────────────── -->
  <aside class="right-sidebar">
    <div class="settings-group">
      <div class="toggle-row">
        <span class="toggle-row-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          Dark Mode
        </span>
        <button class="toggle-switch on" id="darkToggle" onclick="toggleDarkMode()"></button>
      </div>
    </div>

    <div class="settings-group">
      <span class="settings-label">Background Color</span>
      <div class="color-dots">
        <div class="color-dot" data-color="#ffffff" onclick="setBgColor('#ffffff')"></div>
        <div class="color-dot" data-color="#4285f4" onclick="setBgColor('#4285f4')"></div>
        <div class="color-dot" data-color="#ea4335" onclick="setBgColor('#ea4335')"></div>
        <div class="color-dot" data-color="#34a853" onclick="setBgColor('#34a853')"></div>
        <div class="color-dot" data-color="#f48fb1" onclick="setBgColor('#f48fb1')"></div>
        <div class="color-dot" data-color="#000000" onclick="setBgColor('#000000')"></div>
      </div>
    </div>

    <div class="settings-group">
      <span class="settings-label">Padding</span>
      <div class="padding-btns">
        <button class="padding-btn" data-pad="none" onclick="setPadding('none')">None</button>
        <button class="padding-btn active" data-pad="tight" onclick="setPadding('tight')">Tight</button>
        <button class="padding-btn" data-pad="loose" onclick="setPadding('loose')">Loose</button>
      </div>
    </div>

    <div class="settings-group" id="gridSettings">
      <span class="settings-label">Grid Layout</span>
      <div class="num-input-row">
        <label>Rows</label>
        <input type="number" class="num-input" id="gridRows" value="2" min="1" max="6" onchange="renderCanvas()">
      </div>
      <div class="num-input-row" style="margin-top:6px">
        <label>Columns</label>
        <input type="number" class="num-input" id="gridCols" value="2" min="1" max="6" onchange="renderCanvas()">
      </div>
    </div>

    <div class="settings-group">
      <div class="toggle-row">
        <span class="toggle-row-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          Glow
        </span>
        <button class="toggle-switch" id="glowToggle" onclick="toggleGlow()"></button>

          <input type="range" id="glowSlider" min="0" max="100" value="18" oninput="setGlowIntensity(this.value)">
          <span class="glow-pct" id="glowPct">18%</span>
        </div>
      </div>
    </div>

    <div class="settings-group" id="textSettings">
      <div class="toggle-row" style="margin-bottom:8px">
        <span class="toggle-row-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
          Text
        </span>
        <button class="toggle-switch" id="textToggle" onclick="toggleText()"></button>
      </div>
      <div id="textFields" class="hidden">
        <input type="text" class="text-input-field" id="showcaseTitle" placeholder="Title text…" oninput="renderCanvas()">
        <div class="text-icon-btns">
          <button class="text-icon-btn" id="placementBtn" onclick="cyclePlacement()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="7" y1="7" x2="17" y2="7"/></svg>
            <span class="tip">Text Placement</span>
          </button>
          <button class="text-icon-btn" id="alignBtn" onclick="cycleAlignment()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            <span class="tip">Text Alignment</span>
          </button>
          <button class="text-icon-btn" id="sizeBtn" onclick="cycleSize()">
            A
            <span class="tip">Text Size</span>
          </button>
        </div>
      </div>
    </div>

    <button class="save-btn" onclick="saveImage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Save Image
    </button>
  </aside>
</div>

<!-- ── BOTTOM STRIP ─────────────────── -->
<div class="bottom-strip" id="bottomStrip">
  <div class="strip-drop-hint" id="stripDropHint">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    Drop images here or click to browse
  </div>
</div>
<input type="file" multiple accept="image/*" id="fileInput" style="display:none">

<!-- ── TOAST ─────────────────────────── -->
<div class="toast" id="toast"></div>

<script>
'use strict';

// ── STATE ─────────────────────────────
let allImages = [];
let canvasImages = []; // array of image data objects on canvas
let currentMode = 'grid';
let previewFormat = 'default';
let canvasBg = '#111111';
let isDarkMode = true;
let paddingMode = 'tight';
let glowEnabled = false;
let glowIntensity = 18; // 0-100
let textEnabled = false;
let textPlacement = 'top';
let textAlignment = 'center';
let textSizeMode = 'medium'; // small, medium, large

const PLACEMENTS = ['top', 'bottom'];
const ALIGNMENTS = ['left', 'center', 'right'];
const SIZES = ['small', 'medium', 'large'];
const SIZE_LABELS = { small: 'S', medium: 'M', large: 'L' };

const RESOLUTIONS = {
  default: { w: 3060, h: 1878 },
  twitter: { w: 1200, h: 675 }
};

// ── DOM REFS ──────────────────────────
const previewContainer = document.getElementById('previewContainer');
const previewContent = document.getElementById('previewContent');
const previewEmpty = document.getElementById('previewEmpty');
const bottomStrip = document.getElementById('bottomStrip');
const gridSettings = document.getElementById('gridSettings');
const textSettings = document.getElementById('textSettings');
const toast = document.getElementById('toast');

// Placement icon SVGs
const PLACEMENT_ICONS = {
  top: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="7" y1="7" x2="17" y2="7"/></svg>',
  bottom: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="7" y1="17" x2="17" y2="17"/></svg>'
};
const ALIGN_ICONS = {
  left: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="17" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="14" y2="18"/></svg>',
  center: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="6" x2="19" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="6" y1="18" x2="18" y2="18"/></svg>',
  right: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="7" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/></svg>'
};

// ── INIT ──────────────────────────────
let _idCounter = 0;
const fileInput = document.getElementById('fileInput');

document.addEventListener('DOMContentLoaded', () => {
  setupStripDrop();
  updateSettingsVisibility();
});

// ── READ FILES AS DATA URLS ───────────
function readFilesAsImages(files) {
  const imageFiles = [...files].filter(f => f.type.startsWith('image/'));
  if (!imageFiles.length) return;
  imageFiles.forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const src = e.target.result;
      // Extract dominant color from image
      const img = new Image();
      img.onload = () => {
        // Extract 4 corner colors for ambient glow
        const c = document.createElement('canvas');
        const W = img.naturalWidth, H = img.naturalHeight;
        c.width = W; c.height = H;
        const cx = c.getContext('2d');
        cx.drawImage(img, 0, 0);
        const s = 20; // sample size in pixels from each corner
        function sampleCorner(sx, sy) {
          const d = cx.getImageData(sx, sy, Math.min(s, W - sx), Math.min(s, H - sy)).data;
          let rr = 0, gg = 0, bb = 0, cnt = d.length / 4;
          for (let i = 0; i < d.length; i += 4) { rr += d[i]; gg += d[i+1]; bb += d[i+2]; }
          return '#' + [Math.round(rr/cnt), Math.round(gg/cnt), Math.round(bb/cnt)].map(v => Math.min(255,v).toString(16).padStart(2,'0')).join('');
        }
        const corners = [
          sampleCorner(0, 0),          // top-left
          sampleCorner(W - s, 0),      // top-right
          sampleCorner(0, H - s),      // bottom-left
          sampleCorner(W - s, H - s)   // bottom-right
        ];
        const imgData = {
          id: 'sc_' + (++_idCounter) + '_' + Date.now(),
          src: src,
          filename: file.name,
          corners: corners,
          categories: [],
          fav: false
        };
        allImages.push(imgData);
        renderStrip();
        showToast('Added ' + file.name);
      };
      img.src = src;
    };
    reader.readAsDataURL(file);
  });
}

// ── STRIP DROP ZONE ───────────────────
function setupStripDrop() {
  const strip = bottomStrip;
  const hint = document.getElementById('stripDropHint');

  // Click to browse
  hint.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    readFilesAsImages(e.target.files);
    e.target.value = '';
  });

  // Drag over strip
  strip.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    strip.classList.add('drag-over');
  });
  strip.addEventListener('dragleave', (e) => {
    if (!strip.contains(e.relatedTarget)) strip.classList.remove('drag-over');
  });
  strip.addEventListener('drop', (e) => {
    e.preventDefault();
    strip.classList.remove('drag-over');
    if (e.dataTransfer.files && e.dataTransfer.files.length) {
      readFilesAsImages(e.dataTransfer.files);
    }
  });

  // Also allow dropping files on the entire page
  document.body.addEventListener('dragover', (e) => { e.preventDefault(); });
  document.body.addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer.files && e.dataTransfer.files.length) {
      readFilesAsImages(e.dataTransfer.files);
    }
  });
}

// ── STRIP RENDER ──────────────────────
function renderStrip() {
  // Keep the drop hint, clear thumbnails
  const hint = document.getElementById('stripDropHint');
  bottomStrip.innerHTML = '';
  bottomStrip.appendChild(hint);

  allImages.forEach(img => {
    const div = document.createElement('div');
    div.className = 'thumb-item';
    if (canvasImages.find(ci => ci.id === img.id)) div.classList.add('selected');
    div.dataset.id = img.id;

    const imgEl = document.createElement('img');
    imgEl.src = img.src;
    imgEl.alt = img.filename || '';
    div.appendChild(imgEl);

    // Click to add/remove from canvas
    div.addEventListener('click', () => {
      const idx = canvasImages.findIndex(ci => ci.id === img.id);
      if (idx >= 0) {
        canvasImages.splice(idx, 1);
      } else {
        canvasImages.push({ ...img });
      }
      renderStrip();
      renderCanvas();
    });

    bottomStrip.appendChild(div);
  });
}

// ── MODE SWITCHING ────────────────────
document.querySelectorAll('.mode-btn[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn[data-mode]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
    updateSettingsVisibility();
    renderCanvas();
  });
});

document.querySelectorAll('.mode-btn[data-preview]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn[data-preview]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    previewFormat = btn.dataset.preview;
    previewContainer.classList.toggle('ratio-twitter', previewFormat === 'twitter');
    renderCanvas();
  });
});

function updateSettingsVisibility() {
  gridSettings.classList.toggle('hidden', currentMode === 'solo');
}

// ── SETTINGS ──────────────────────────
function toggleDarkMode() {
  isDarkMode = !isDarkMode;
  document.getElementById('darkToggle').classList.toggle('on', isDarkMode);
  canvasBg = isDarkMode ? '#111111' : '#f5f5f5';
  // clear active color dot
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
  renderCanvas();
}

function setBgColor(color) {
  canvasBg = color;
  isDarkMode = color === '#111111' || color === '#000000';
  document.getElementById('darkToggle').classList.toggle('on', isDarkMode);
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
  document.querySelector(`.color-dot[data-color="${color}"]`)?.classList.add('active');
  renderCanvas();
}

function setPadding(mode) {
  paddingMode = mode;
  document.querySelectorAll('.padding-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.padding-btn[data-pad="${mode}"]`).classList.add('active');
  renderCanvas();
}

function toggleGlow() {
  glowEnabled = !glowEnabled;
  document.getElementById('glowToggle').classList.toggle('on', glowEnabled);
  document.getElementById('glowSliderWrap').classList.toggle('hidden', !glowEnabled);
  renderCanvas();
}

function setGlowIntensity(val) {
  glowIntensity = parseInt(val);
  document.getElementById('glowPct').textContent = glowIntensity + '%';
  renderCanvas();
}

function toggleText() {
  textEnabled = !textEnabled;
  document.getElementById('textToggle').classList.toggle('on', textEnabled);
  document.getElementById('textFields').classList.toggle('hidden', !textEnabled);
  renderCanvas();
}

function cyclePlacement() {
  const i = (PLACEMENTS.indexOf(textPlacement) + 1) % PLACEMENTS.length;
  textPlacement = PLACEMENTS[i];
  const btn = document.getElementById('placementBtn');
  btn.querySelector('svg').outerHTML = PLACEMENT_ICONS[textPlacement];
  btn.querySelector('.tip').textContent = 'Placement: ' + textPlacement;
  renderCanvas();
}

function cycleAlignment() {
  const i = (ALIGNMENTS.indexOf(textAlignment) + 1) % ALIGNMENTS.length;
  textAlignment = ALIGNMENTS[i];
  const btn = document.getElementById('alignBtn');
  btn.querySelector('svg').outerHTML = ALIGN_ICONS[textAlignment];
  btn.querySelector('.tip').textContent = 'Align: ' + textAlignment;
  renderCanvas();
}

function cycleSize() {
  const i = (SIZES.indexOf(textSizeMode) + 1) % SIZES.length;
  textSizeMode = SIZES[i];
  const btn = document.getElementById('sizeBtn');
  btn.childNodes[0].textContent = SIZE_LABELS[textSizeMode];
  btn.querySelector('.tip').textContent = 'Size: ' + textSizeMode;
  renderCanvas();
}

function getPadding() {
  if (paddingMode === 'none') return 0;
  if (paddingMode === 'tight') return 16;
  return 32;
}

function getCorners(img) {
  if (img.corners && img.corners.length === 4) return img.corners;
  // fallback: use palette or gray
  const c = (img.palette && img.palette.length > 0) ? img.palette[0] : '#444444';
  return [c, c, c, c];
}

function hexToRgba(hex, alpha) {
  if (!hex || hex.length < 7) hex = '#444444';
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ── RENDER CANVAS ─────────────────────
function renderCanvas() {
  previewContent.innerHTML = '';
  previewContainer.style.background = canvasBg;

  const pad = getPadding();

  const titleText = textEnabled ? (document.getElementById('showcaseTitle').value || '') : '';
  const isDark = isCanvasDark();

  // Build text element if needed
  let textEl = null;
  if (titleText) {
    const sizeMap = { small: 'clamp(12px, 1.8vw, 20px)', medium: 'clamp(16px, 2.6vw, 30px)', large: 'clamp(20px, 3.6vw, 42px)' };
    textEl = document.createElement('div');
    textEl.className = 'showcase-text';
    textEl.textContent = titleText;
    const vPad = pad;
    textEl.style.cssText = `
      width: 100%; box-sizing: border-box;
      text-align: ${textAlignment};
      font-size: ${sizeMap[textSizeMode]};
      padding: ${vPad}px ${pad + 4}px;
      color: ${isDark ? '#fff' : '#111'};
      line-height: 1.3;
    `;
  }

  // Empty state
  if (canvasImages.length === 0) {
    previewEmpty.style.opacity = '1';
    previewEmpty.style.position = 'relative';
    previewEmpty.style.minHeight = '300px';
    previewContent.appendChild(previewEmpty);
    if (currentMode === 'grid') {
      previewEmpty.style.opacity = '0';
      renderGrid(pad, previewContent);
    }
    return;
  }
  previewEmpty.style.opacity = '0';
  previewEmpty.style.position = 'absolute';
  previewContent.appendChild(previewEmpty);

  // Assemble: text on top or bottom, grid in the middle
  if (textEl && textPlacement === 'top') previewContent.appendChild(textEl);

  switch (currentMode) {
    case 'grid': renderGrid(pad, previewContent); break;
    case 'compare': renderCompare(pad, previewContent); break;
    case 'solo': renderSolo(pad, previewContent); break;
  }

  if (textEl && textPlacement === 'bottom') previewContent.appendChild(textEl);
}

function createCanvasImageEl(imgData) {
  const wrap = document.createElement('div');
  wrap.className = 'canvas-img-wrap';

  // Ambient glow: blurred copy of image behind
  if (glowEnabled) {
    const glow = document.createElement('div');
    glow.className = 'ambient-glow';
    glow.style.opacity = glowIntensity / 100;
    const glowImg = document.createElement('img');
    glowImg.src = imgData.src;
    glowImg.draggable = false;
    glow.appendChild(glowImg);
    wrap.appendChild(glow);
  }

  // image
  const img = document.createElement('img');
  img.src = imgData.src;
  img.alt = imgData.filename || '';
  img.draggable = false;
  wrap.appendChild(img);

  // remove btn
  const removeBtn = document.createElement('button');
  removeBtn.className = 'remove-btn';
  removeBtn.innerHTML = '✕';
  removeBtn.onclick = (e) => {
    e.stopPropagation();
    canvasImages = canvasImages.filter(ci => ci.id !== imgData.id);
    renderStrip();
    renderCanvas();
  };
  wrap.appendChild(removeBtn);

  return wrap;
}

function addDragSwap(el, i) {
  el.draggable = true;
  el.dataset.idx = i;
  el.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', i);
    el.classList.add('dragging');
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag-over'); });
  el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
  el.addEventListener('drop', e => {
    e.preventDefault();
    el.classList.remove('drag-over');
    const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
    if (fromIdx !== i && fromIdx < canvasImages.length && i < canvasImages.length) {
      const temp = canvasImages[fromIdx];
      canvasImages[fromIdx] = canvasImages[i];
      canvasImages[i] = temp;
      renderCanvas();
    }
  });
}

function renderGrid(pad, container) {
  const rows = parseInt(document.getElementById('gridRows').value) || 2;
  const cols = parseInt(document.getElementById('gridCols').value) || 2;
  const total = rows * cols;

  const grid = document.createElement('div');
  grid.style.cssText = `
    display: grid;
    grid-template-columns: repeat(${cols}, 1fr);
    gap: ${pad}px;
    padding: ${pad}px;
    width: 100%;
    box-sizing: border-box;
  `;

  for (let i = 0; i < total; i++) {
    if (i < canvasImages.length) {
      const el = createCanvasImageEl(canvasImages[i]);
      addDragSwap(el, i);
      grid.appendChild(el);
    } else {
      const placeholder = document.createElement('div');
      placeholder.className = 'grid-placeholder';
      placeholder.style.aspectRatio = '16/9';
      placeholder.textContent = '+';
      grid.appendChild(placeholder);
    }
  }

  container.appendChild(grid);
}

function renderCompare(pad, target) {
  const container = target || previewContent;
  const stack = document.createElement('div');
  stack.style.cssText = `
    display: flex; flex-direction: column; gap: ${pad}px; padding: ${pad}px;
    width: 100%; box-sizing: border-box;
  `;

  canvasImages.forEach((imgData, i) => {
    const el = createCanvasImageEl(imgData);
    addDragSwap(el, i);
    stack.appendChild(el);
  });

  container.appendChild(stack);
}

function renderSolo(pad, target) {
  const container = target || previewContent;
  const imgData = canvasImages[0];
  if (!imgData) return;

  const wrap = document.createElement('div');
  wrap.style.cssText = `padding: ${pad}px; width: 100%; box-sizing: border-box;`;

  const el = createCanvasImageEl(imgData);
  wrap.appendChild(el);
  container.appendChild(wrap);
}

function isCanvasDark() {
  const hex = canvasBg.replace('#', '');
  const r = parseInt(hex.substring(0, 2), 16);
  const g = parseInt(hex.substring(2, 4), 16);
  const b = parseInt(hex.substring(4, 6), 16);
  return (r * 0.299 + g * 0.587 + b * 0.114) < 128;
}

// ── SAVE / EXPORT ─────────────────────
async function saveImage() {
  if (canvasImages.length === 0) {
    showToast('Add images to the canvas first');
    return;
  }

  showToast('Rendering image…');

  const rows = parseInt(document.getElementById('gridRows').value) || 2;
  const cols = parseInt(document.getElementById('gridCols').value) || 2;

  // For grid mode: each tile = 1920×1080, canvas sized to fit
  let res;
  if (currentMode === 'grid') {
    const tilePad = 32; // padding between tiles
    const w = cols * 1920 + (cols + 1) * tilePad;
    const h = rows * 1080 + (rows + 1) * tilePad;
    res = { w, h };
  } else {
    res = RESOLUTIONS[previewFormat];
  }

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  const pad = currentMode === 'grid' ? 32 : getPaddingPx(res);

  // Text layout offsets
  const titleText = textEnabled ? (document.getElementById('showcaseTitle').value || '') : '';
  const sizeScale = { small: 0.7, medium: 1, large: 1.5 };
  const textSize = Math.round(36 * (res.w / 900) * (sizeScale[textSizeMode] || 1));
  const dark = isCanvasDark();

  let textBlockH = 0;
  if (titleText) {
    textBlockH = Math.round(textSize * 1.8);
  }

  // Final canvas size includes text
  canvas.width = res.w;
  canvas.height = res.h + textBlockH;

  // background
  ctx.fillStyle = canvasBg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let contentY = 0, contentH = res.h;
  if (titleText) {
    if (textPlacement === 'top') {
      contentY = textBlockH;
    }
  }

  // load all images
  const loadedImgs = await Promise.all(
    canvasImages.map(imgData => loadImage(imgData.src))
  );

  switch (currentMode) {
    case 'grid': drawGrid(ctx, res, pad, loadedImgs, contentY, contentH); break;
    case 'compare': drawCompare(ctx, res, pad, loadedImgs, contentY, contentH); break;
    case 'solo': drawSolo(ctx, res, pad, loadedImgs, contentY, contentH); break;
  }

  // Draw text
  if (titleText) {
    ctx.font = `700 ${textSize}px 'Helvetica Neue', Helvetica, Arial, sans-serif`;
    ctx.fillStyle = dark ? '#fff' : '#111';
    ctx.textBaseline = 'middle';

    // Alignment
    let textX;
    if (textAlignment === 'left') {
      ctx.textAlign = 'left';
      textX = pad + 16;
    } else if (textAlignment === 'right') {
      ctx.textAlign = 'right';
      textX = canvas.width - pad - 16;
    } else {
      ctx.textAlign = 'center';
      textX = canvas.width / 2;
    }

    // Text Y: centered in the text block area
    let textY;
    if (textPlacement === 'top') {
      textY = textBlockH / 2;
    } else {
      textY = contentH + textBlockH / 2;
    }
    ctx.fillText(titleText, textX, textY);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  canvas.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const date = new Date().toISOString().split('T')[0];
    a.download = `showcase-${date}.png`;
    a.href = url;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Image saved!');
  }, 'image/png');
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function getPaddingPx(res) {
  const scale = res.w / 900;
  if (paddingMode === 'none') return 0;
  if (paddingMode === 'tight') return Math.round(16 * scale);
  return Math.round(32 * scale);
}

function drawRoundedImage(ctx, img, x, y, w, h, r, imgData) {
  // Ambient corner glow
  if (glowEnabled) {
    const corners = getCorners(imgData || {});
    const spread = Math.max(w, h) * 0.25;
    const alpha = glowIntensity / 100;
    // Top-left
    const g0 = ctx.createRadialGradient(x, y, 0, x, y, spread);
    g0.addColorStop(0, hexToRgba(corners[0], alpha));
    g0.addColorStop(1, 'transparent');
    ctx.fillStyle = g0;
    ctx.fillRect(x - spread, y - spread, spread * 2, spread * 2);
    // Top-right
    const g1 = ctx.createRadialGradient(x + w, y, 0, x + w, y, spread);
    g1.addColorStop(0, hexToRgba(corners[1], alpha));
    g1.addColorStop(1, 'transparent');
    ctx.fillStyle = g1;
    ctx.fillRect(x + w - spread, y - spread, spread * 2, spread * 2);
    // Bottom-left
    const g2 = ctx.createRadialGradient(x, y + h, 0, x, y + h, spread);
    g2.addColorStop(0, hexToRgba(corners[2], alpha));
    g2.addColorStop(1, 'transparent');
    ctx.fillStyle = g2;
    ctx.fillRect(x - spread, y + h - spread, spread * 2, spread * 2);
    // Bottom-right
    const g3 = ctx.createRadialGradient(x + w, y + h, 0, x + w, y + h, spread);
    g3.addColorStop(0, hexToRgba(corners[3], alpha));
    g3.addColorStop(1, 'transparent');
    ctx.fillStyle = g3;
    ctx.fillRect(x + w - spread, y + h - spread, spread * 2, spread * 2);
  }

  // clipped image (cover fit — fills cell, no empty space)
  ctx.save();
  ctx.beginPath();
  roundedRect(ctx, x, y, w, h, r);
  ctx.clip();
  const imgAspect = img.naturalWidth / img.naturalHeight;
  const cellAspect = w / h;
  let sx, sy, sw, sh;
  if (imgAspect > cellAspect) {
    sh = img.naturalHeight;
    sw = sh * cellAspect;
    sx = (img.naturalWidth - sw) / 2;
    sy = 0;
  } else {
    sw = img.naturalWidth;
    sh = sw / cellAspect;
    sx = 0;
    sy = (img.naturalHeight - sh) / 2;
  }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  ctx.restore();
}

function roundedRect(ctx, x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawGrid(ctx, res, pad, imgs, contentY, contentH) {
  const rows = parseInt(document.getElementById('gridRows').value) || 2;
  const cols = parseInt(document.getElementById('gridCols').value) || 2;
  const cellW = (res.w - pad * (cols + 1)) / cols;
  const cellH = (contentH - pad * (rows + 1)) / rows;
  const r = Math.round(cellW * 0.05); // 3% corner radius

  for (let i = 0; i < rows * cols; i++) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = pad + col * (cellW + pad);
    const y = contentY + pad + row * (cellH + pad);

    if (i < imgs.length) {
      drawRoundedImage(ctx, imgs[i], x, y, cellW, cellH, r, canvasImages[i]);
    } else {
      ctx.save();
      ctx.setLineDash([10, 8]);
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      roundedRect(ctx, x, y, cellW, cellH, r);
      ctx.stroke();
      ctx.restore();
    }
  }
}

function drawCompare(ctx, res, pad, imgs, contentY, contentH) {
  const count = imgs.length;
  const cellH = (contentH - pad * (count + 1)) / count;
  const cellW = res.w - pad * 2;
  const r = Math.round(cellW * 0.05); // 3% corner radius

  imgs.forEach((img, i) => {
    const x = pad;
    const y = contentY + pad + i * (cellH + pad);
    drawRoundedImage(ctx, img, x, y, cellW, cellH, r, canvasImages[i]);
  });
}

function drawSolo(ctx, res, pad, imgs, contentY, contentH) {
  if (imgs.length === 0) return;
  const img = imgs[0];
  const imgData = canvasImages[0];
  const r = Math.round(Math.min(res.w, contentH) * 0.05); // 3% corner radius

  const imgAspect = img.naturalWidth / img.naturalHeight;
  const maxW = res.w - pad * 2;
  const maxH = contentH - pad * 2;
  let drawW, drawH;
  if (maxW / maxH > imgAspect) {
    drawH = maxH;
    drawW = drawH * imgAspect;
  } else {
    drawW = maxW;
    drawH = drawW / imgAspect;
  }
  const x = (res.w - drawW) / 2;
  const y = contentY + (contentH - drawH) / 2;
  drawRoundedImage(ctx, img, x, y, drawW, drawH, r, imgData);
}

// ── TOAST ─────────────────────────────
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ── INITIAL RENDER ────────────────────
renderCanvas();
</script>
